<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Affiliate Events</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    :root {
      --bg: #ffffff;
      --fg: #1a1a1a;
      --primary: #0070f3;
      --border: #eaeaea;
      --muted: #666;
    }

    body {
      font-family: 'Segoe UI', sans-serif;
      background: var(--bg);
      color: var(--fg);
      max-width: 960px;
      margin: auto;
      padding: 2rem 1.5rem;
      line-height: 1.6;
    }

    h1 {
      font-size: 2.2rem;
      font-weight: 600;
      margin-bottom: 0.5rem;
      color: var(--primary);
    }

    p.description {
      margin-bottom: 1.5rem;
      font-size: 1rem;
      color: var(--muted);
    }

    .filters {
      margin-bottom: 1.5rem;
    }

    .filters input,
    .filters select {
      padding: 0.5rem;
      margin-right: 1rem;
      font-size: 1rem;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      border: 1px solid var(--border);
      box-shadow: 0 2px 8px rgba(0,0,0,0.05);
    }

    th, td {
      text-align: left;
      padding: 1rem;
      border-bottom: 1px solid var(--border);
    }

    th {
      background-color: #f9f9f9;
      font-weight: 500;
      color: #333;
    }

    tr:hover {
      background-color: #f3f8ff;
    }

    .footer {
      margin-top: 2.5rem;
      text-align: center;
      font-size: 0.85rem;
      color: var(--muted);
    }

    @media (max-width: 640px) {
      table, thead, tbody, th, td, tr {
        display: block;
      }
      tr {
        margin-bottom: 1rem;
      }
      th {
        display: none;
      }
      td {
        border: none;
        position: relative;
        padding-left: 50%;
        text-align: left;
      }
      td::before {
        position: absolute;
        left: 1rem;
        top: 1rem;
        font-weight: bold;
        white-space: nowrap;
      }
      td:nth-child(1)::before { content: "Date"; }
      td:nth-child(2)::before { content: "Event"; }
      td:nth-child(3)::before { content: "Organization"; }
    }
  </style>
</head>
<body>
  <h1>Upcoming Affiliate Events</h1>
  <p class="description">Automatically updated list of upcoming events from affiliate organizations.</p>

  <div class="filters">
    <input type="text" id="search" placeholder="Search events..." />
    <select id="orgFilter">
      <option value="">All Organizations</option>
    </select>
  </div>

  <table>
    <thead>
      <tr><th>Date</th><th>Event</th><th>Organization</th></tr>
    </thead>
    <tbody id="events"></tbody>
  </table>

  <div class="footer">
    Data updates daily via GitHub Actions · Last refreshed from scraped sources
  </div>

  <script>
    function formatDate(dateStr) {
      const date = new Date(dateStr);
      return date.toLocaleDateString(undefined, {
        weekday: 'short',
        year: 'numeric',
        month: 'short',
        day: 'numeric'
      });
    }

    let allEvents = [];

    function renderTable(events) {
      const tbody = document.getElementById('events');
      tbody.innerHTML = '';

      if (!events.length) {
        tbody.innerHTML = '<tr><td colspan="3">No matching events found.</td></tr>';
        return;
      }

      events.forEach(event => {
        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td>${formatDate(event.date)}</td>
          <td>${event.event_name}</td>
          <td>${event.organization}</td>
        `;
        tbody.appendChild(tr);
      });
    }

    function updateFilters() {
      const searchValue = document.getElementById('search').value.toLowerCase();
      const selectedOrg = document.getElementById('orgFilter').value;

      const filtered = allEvents.filter(ev => {
        const matchesText = (
          ev.event_name.toLowerCase().includes(searchValue) ||
          ev.organization.toLowerCase().includes(searchValue)
        );
        const matchesOrg = !selectedOrg || ev.organization === selectedOrg;
        return matchesText && matchesOrg;
      });

      renderTable(filtered);
    }

    fetch('data.json')
      .then(res => res.json())
      .then(events => {
        allEvents = events;

        // Populate organization filter
        const orgs = [...new Set(events.map(e => e.organization))].sort();
        const orgFilter = document.getElementById('orgFilter');
        orgs.forEach(org => {
          const option = document.createElement('option');
          option.value = org;
          option.textContent = org;
          orgFilter.appendChild(option);
        });

        renderTable(events);
      })
      .catch(err => {
        document.getElementById('events').innerHTML =
          `<tr><td colspan="3">⚠️ Error loading events: ${err.message}</td></tr>`;
      });

    document.getElementById('search').addEventListener('input', updateFilters);
    document.getElementById('orgFilter').addEventListener('change', updateFilters);
  </script>
</body>
</html>
