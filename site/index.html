<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <title>Upcoming Policy Events</title>
  <style>
    body { font-family: sans-serif; padding: 2rem; max-width: 900px; margin: auto; }
    h1 { font-size: 2rem; }
    table { width: 100%; border-collapse: collapse; margin-top: 1rem; }
    th, td { border: 1px solid #ccc; padding: 0.5rem; text-align: left; }
    th { background-color: #f2f2f2; }
  </style>
</head>
<body>
  <h1>Upcoming Events</h1>
  <table>
    <thead>
      <tr><th>Date</th><th>Event</th><th>Organization</th></tr>
    </thead>
    <tbody id="events"></tbody>
  </table>

  <script>
    fetch('data.json')
      .then(response => response.json())
      .then(events => {
        const tbody = document.getElementById('events');
        events.forEach(event => {
          const tr = document.createElement('tr');
          tr.innerHTML = `<td>${event.date}</td><td>${event.event_name}</td><td>${event.organization}</td>`;
          tbody.appendChild(tr);
        });
      })
      .catch(err => {
        document.getElementById('events').innerHTML =
          `<tr><td colspan="3">Failed to load data: ${err}</td></tr>`;
      });
  </script>
</body>
</html>
